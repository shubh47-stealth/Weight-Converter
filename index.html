<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <style>
        body{
            margin-top: 70px;
            background-color: #333;
            color: #fff;
        }
    </style>
    <title>Weight Converter</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <h1 class="display-4 text-center mb-3">Weight Converter</h1>
                <form>
                    <div class="form-group">
                        <input type="text" id="lbsInput" class="form-control form-control-lg" placeholder="Enter in pounds...">
                    </div>
                </form>
                <div id="output">
                    <div class="card bg-primary mb-2">
                        <div class="card-body">
                            <h4>Grams:</h4>
                            <div id="gramsOutput"></div>
                        </div>
                    </div>
                    <div class="card bg-success mb-2">
                        <div class="card-body">
                            <h4>Kilograms:</h4>
                            <div id="kgOutput"></div>
                        </div>
                    </div>
                    <div class="card bg-danger mb-2">
                        <div class="card-body">
                            <h4>Ounces:</h4>
                            <div id="ozOutput"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('output').style.visibility = 'hidden'

        let lbsInput = document.getElementById('lbsInput')

        lbsInput.addEventListener('input', converter)

        function converter(){
            document.getElementById('output').style.visibility = 'visible'
            lbsInputValue = lbsInput.value            
            let grams = document.getElementById('gramsOutput')
            grams.innerHTML = (lbsInputValue * 453.592).toFixed(2)
            let kg = document.getElementById('kgOutput')
            kg.innerHTML = (lbsInputValue * 0.453592).toFixed(2)
            let oz = document.getElementById('ozOutput')
            oz.innerHTML = (lbsInputValue * 16).toFixed(2)

        }
    </script>
</body>
</html>
